name: Tests and Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:
    inputs:
      force_build_libkrun:
        description: 'Force build libkrun'
        required: false
        type: boolean
        default: false

env:
  LIBKRUNFW_FULL_VERSION: "4.10.0"
  LIBKRUNFW_ABI_VERSION: "4"
  LIBKRUN_VERSION: "1.14.0"
  LIBKRUN_ABI_VERSION: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-libkrun-cache-changes:
    strategy:
      matrix:
        os: [macos-26, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    outputs:
      cache_hit: ${{ steps.check_cache.outputs.cache-hit }}
      libkrun_hash: ${{ steps.hash_libkrun.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Hash build_libkrun.sh
        id: hash_libkrun
        run: |
          HASH=$(sha256sum scripts/build_libkrun.sh | awk '{ print $1 }')
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Calculated hash: $HASH"

      - name: Check if cache exists
        id: check_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/libkrunfw/libkrunfw*.so*
            build/libkrun/target/release/libkrun*.so*
            build/libkrunfw.so*
            build/libkrun.so*
          key: ${{ runner.os }}-libkrun-${{ steps.hash_libkrun.outputs.hash }}

  build-libkrun:
    needs: check-libkrun-cache-changes
    if: |
      github.event.inputs.force_build_libkrun == 'true' ||
      needs.check-libkrun-cache-changes.outputs.cache_hit != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -qqy
          sudo apt-get install -y jq libelf-dev build-essential flex bison libssl-dev libncurses5-dev python3-pip
          pip3 install --user pyelftools

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Build libkrun
        run: |
          ./scripts/build_libkrun.sh --no-cleanup --force-build

      - name: Cache libkrun
        uses: actions/cache/save@v4
        with:
          path: |
            build/libkrunfw/libkrunfw*.so*
            build/libkrun/target/release/libkrun*.so*
            build/libkrunfw.so*
            build/libkrun.so*
          key: ${{ runner.os }}-libkrun-${{ needs.check-libkrun-cache-changes.outputs.libkrun_hash }}

  run-checks:
    needs: [check-libkrun-cache-changes, build-libkrun]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Project
        uses: Swatinem/rust-cache@v2

      - name: Restore libkrun cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/libkrunfw/libkrunfw*.so*
            build/libkrun/target/release/libkrun*.so*
            build/libkrunfw.so*
            build/libkrun.so*
          key: ${{ runner.os }}-libkrun-${{ needs.check-libkrun-cache-changes.outputs.libkrun_hash }}

      - name: Install Rust Toolchain (stable)
        uses: actions-rs/toolchain@v1
        with:
          override: true
          components: clippy
          toolchain: stable

      - name: Install Rust Toolchain (nightly)
        uses: actions-rs/toolchain@v1
        with:
          override: true
          components: rustfmt
          toolchain: nightly

      - name: Check Format
        uses: actions-rs/cargo@v1
        with:
          args: --all -- --check
          command: fmt
          toolchain: nightly # use nightly for fmt

      - name: Run Linter
        uses: actions-rs/cargo@v1
        with:
          args: --all --all-features -- -D warnings
          command: clippy
          toolchain: stable

      - name: Check Advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
        continue-on-error: true

      - name: Check Bans, Licenses, and Sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

      - name: Build Release
        run: |
          export LIBRARY_PATH=${{ github.workspace }}/build:${{ github.workspace }}/build/libkrunfw:${{ github.workspace }}/build/libkrun/target/release
          export LD_LIBRARY_PATH=${{ github.workspace }}/build:${{ github.workspace }}/build/libkrunfw:${{ github.workspace }}/build/libkrun/target/release
          cargo check --all-features
          cargo build --release

      - name: Upload Release Binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-binaries
          path: |
            target/release/msb
            target/release/msbrun
            target/release/msbserver
          retention-days: 1

  run-tests:
    needs: [check-libkrun-cache-changes, build-libkrun]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore libkrun cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/libkrunfw/libkrunfw*.so*
            build/libkrun/target/release/libkrun*.so*
            build/libkrunfw.so*
            build/libkrun.so*
          key: ${{ runner.os }}-libkrun-${{ needs.check-libkrun-cache-changes.outputs.libkrun_hash }}

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          override: true
          toolchain: stable

      # RUSTDOCFLAGS sets rpath so rustdoc tests (which run in /tmp) can find shared libraries at runtime
      - name: Run Tests
        run: |
          export LIBRARY_PATH=${{ github.workspace }}/build:${{ github.workspace }}/build/libkrunfw:${{ github.workspace }}/build/libkrun/target/release
          export LD_LIBRARY_PATH=${{ github.workspace }}/build:${{ github.workspace }}/build/libkrunfw:${{ github.workspace }}/build/libkrun/target/release
          export RUSTDOCFLAGS="-C link-args=-Wl,-rpath,${{ github.workspace }}/build,-rpath,${{ github.workspace }}/build/libkrunfw,-rpath,${{ github.workspace }}/build/libkrun/target/release"
          cargo test --workspace -- --include-ignored

  linux-e2e:
    needs: [check-libkrun-cache-changes, run-checks]
    if: always() && needs.run-checks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore libkrun cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/libkrunfw/libkrunfw*.so*
            build/libkrun/target/release/libkrun*.so*
            build/libkrunfw.so*
            build/libkrun.so*
          key: ${{ runner.os }}-libkrun-${{ needs.check-libkrun-cache-changes.outputs.libkrun_hash }}

      - name: Download Release Binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-release-binaries
          path: bin/

      - name: Set Up Binaries and Libraries
        run: |
          chmod +x bin/msb bin/msbrun bin/msbserver
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH
          LIB_PATH="${{ github.workspace }}/build:${{ github.workspace }}/build/libkrunfw:${{ github.workspace }}/build/libkrun/target/release"
          echo "LD_LIBRARY_PATH=$LIB_PATH" >> $GITHUB_ENV
          echo "MSBRUN_EXE=${{ github.workspace }}/bin/msbrun" >> $GITHUB_ENV
          echo "MSBSERVER_EXE=${{ github.workspace }}/bin/msbserver" >> $GITHUB_ENV

      - name: Enable KVM Access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Run E2E Smoke Tests
        run: bash scripts/ci/e2e_smoke_test.sh

  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Project
        uses: Swatinem/rust-cache@v2

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          override: true
          toolchain: stable

      - name: Compile Check
        run: cargo check --workspace

      - name: Run Platform-Independent Tests
        run: cargo test -p microsandbox-core --lib -- config::mount_spec config::reference_path config::path_pair config::path_segment backend::windows::rootfs backend::windows::hcs backend::windows::networking backend::windows::supervisor backend::windows::boot_bundle

      - name: Run Utils Platform Tests
        run: cargo test -p microsandbox-utils --lib -- platform

      - name: Build Release
        run: cargo build --release

      - name: Run Windows Smoke Tests
        run: |
          $env:MSB_BIN = "${{ github.workspace }}\target\release\msb.exe"
          $env:MSBRUN_EXE = "${{ github.workspace }}\target\release\msbrun.exe"
          $env:MSBSERVER_EXE = "${{ github.workspace }}\target\release\msbserver.exe"
          powershell -ExecutionPolicy Bypass -File scripts\ci\windows_smoke_test.ps1

  macos-e2e:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Project
        uses: Swatinem/rust-cache@v2

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          override: true
          toolchain: stable

      - name: Compile Check
        run: cargo check --workspace

      - name: Run Utils Tests
        run: cargo test -p microsandbox-utils

      - name: Create Stub libkrun for Linking
        run: |
          mkdir -p build
          cat > /tmp/libkrun_stub.c << 'STUBEOF'
          int krun_set_log_level(int l) { return 0; }
          int krun_create_ctx() { return 0; }
          int krun_free_ctx(int c) { return 0; }
          int krun_set_vm_config(int c, int v, int r) { return 0; }
          int krun_set_root(int c, const char *r) { return 0; }
          int krun_set_overlayfs_root(int c, const char *r) { return 0; }
          int krun_add_disk(int c, const char *p) { return 0; }
          int krun_add_virtiofs(int c, const char *t, const char *p) { return 0; }
          int krun_add_virtiofs2(int c, const char *t, const char *p) { return 0; }
          int krun_set_passt_fd(int c, int f) { return 0; }
          int krun_set_gvproxy_path(int c, const char *p) { return 0; }
          int krun_set_net_mac(int c, const char *m) { return 0; }
          int krun_set_port_map(int c, const char *m) { return 0; }
          int krun_set_tsi_scope(int c, int s) { return 0; }
          int krun_set_gpu_options(int c, int o) { return 0; }
          int krun_set_gpu_options2(int c, int a, int b) { return 0; }
          int krun_set_snd_device(int c, int d) { return 0; }
          int krun_set_rlimits(int c, const char *r) { return 0; }
          int krun_set_smbios_oem_strings(int c, const char *s) { return 0; }
          int krun_set_workdir(int c, const char *w) { return 0; }
          int krun_set_exec(int c, const char *e, const char *a) { return 0; }
          int krun_set_env(int c, const char *e) { return 0; }
          int krun_set_tee_config_file(int c, const char *p) { return 0; }
          int krun_add_vsock_port(int c, int p) { return 0; }
          int krun_get_shutdown_eventfd(int c) { return 0; }
          int krun_set_console_output(int c, int o) { return 0; }
          int krun_start_enter(int c) { return 0; }
          STUBEOF
          cc -shared -o build/libkrun.dylib /tmp/libkrun_stub.c

      - name: Build Release
        run: |
          export LIBRARY_PATH=${{ github.workspace }}/build
          cargo build --release

      - name: Run macOS Smoke Tests
        run: |
          export DYLD_LIBRARY_PATH=${{ github.workspace }}/build
          export MSB_BIN=${{ github.workspace }}/target/release/msb
          export MSBRUN_EXE=${{ github.workspace }}/target/release/msbrun
          export MSBSERVER_EXE=${{ github.workspace }}/target/release/msbserver
          bash scripts/ci/macos_smoke_test.sh
